<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="TrackBridge">
  <defs>
    <linearGradient id="bridgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d6efd"/>
      <stop offset="55%" stop-color="#0a58ca"/>
      <stop offset="100%" stop-color="#084298"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#0dcaf0"/>
      <stop offset="100%" stop-color="#0d6efd"/>
    </linearGradient>
    <linearGradient id="trackGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="rgba(34,211,238,0.55)"/>
      <stop offset="60%" stop-color="rgba(13,110,253,0.15)"/>
      <stop offset="100%" stop-color="rgba(13,110,253,0)"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="10" y="10" width="300" height="300" rx="68" fill="url(#bridgeGrad)"/>

  <!-- Decorative circles -->
  <circle cx="260" cy="60" r="84" fill="rgba(255,255,255,0.10)"/>
  <circle cx="60" cy="270" r="96" fill="rgba(34,211,238,0.18)"/>

  <!-- Soft glow behind the bridge -->
  <circle cx="160" cy="160" r="110" fill="url(#glow)"/>

  <!-- The Bridge arch -->
  <g stroke-linecap="round" fill="none">
    <path d="M 56 188 Q 160 80 264 188" stroke="url(#arcGrad)" stroke-width="10"/>
    <path d="M 56 188 Q 160 96 264 188" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  </g>

  <!-- Bridge pylons -->
  <g fill="#ffffff">
    <rect x="60" y="184" width="14" height="58" rx="3"/>
    <rect x="246" y="184" width="14" height="58" rx="3"/>
  </g>

  <!-- Bridge deck (track) -->
  <g>
    <rect x="50" y="210" width="220" height="10" rx="5" fill="#ffffff"/>
    <rect x="50" y="210" width="220" height="10" rx="5" fill="url(#trackGrad)" opacity="0.35"/>
    <!-- Track tick marks -->
    <g fill="#0a58ca">
      <rect x="70"  y="222" width="3" height="8" rx="1.5"/>
      <rect x="90"  y="222" width="3" height="8" rx="1.5"/>
      <rect x="110" y="222" width="3" height="8" rx="1.5"/>
      <rect x="130" y="222" width="3" height="8" rx="1.5"/>
      <rect x="150" y="222" width="3" height="8" rx="1.5"/>
      <rect x="170" y="222" width="3" height="8" rx="1.5"/>
      <rect x="190" y="222" width="3" height="8" rx="1.5"/>
      <rect x="210" y="222" width="3" height="8" rx="1.5"/>
      <rect x="230" y="222" width="3" height="8" rx="1.5"/>
    </g>
  </g>

  <!-- Suspension cables -->
  <g stroke="rgba(255,255,255,0.55)" stroke-width="1.5" fill="none">
    <line x1="60"  y1="188" x2="160" y2="138"/>
    <line x1="90"  y1="156" x2="160" y2="138"/>
    <line x1="120" y1="132" x2="160" y2="138"/>
    <line x1="160" y1="138" x2="200" y2="132"/>
    <line x1="160" y1="138" x2="230" y2="156"/>
    <line x1="160" y1="138" x2="260" y2="188"/>
  </g>

  <!-- "Tracking" dot moving along the track -->
  <g>
    <circle cx="160" cy="200" r="9" fill="#ffffff"/>
    <circle cx="160" cy="200" r="9" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>
    <circle cx="160" cy="200" r="3.5" fill="#0a58ca"/>
  </g>

  <!-- Brand text -->
  <g font-family="'Segoe UI', Roboto, system-ui, sans-serif" text-anchor="middle" fill="#ffffff">
    <text x="160" y="270" font-size="28" font-weight="800" letter-spacing="3">TRACKBRIDGE</text>
    <text x="160" y="292" font-size="11" font-weight="500" letter-spacing="4" opacity="0.75">SCHEDULE &#8226; WORK &#8226; QC</text>
  </g>
</svg>
