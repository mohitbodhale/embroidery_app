  </defs>

  <rect x="10" y="10" width="180" height="180" rx="40" fill="url(#bgGradH)"/>

  <circle cx="160" cy="40" r="50" fill="rgba(255,255,255,0.10)"/>
  <circle cx="40" cy="170" r="60" fill="rgba(34,211,238,0.18)"/>

