<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" role="img" aria-label="TrackBridge">
  <defs>
    <linearGradient id="bgGradH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d6efd"/>
      <stop offset="55%" stop-color="#0a58ca"/>
      <stop offset="100%" stop-color="#084298"/>
    </linearGradient>
    <linearGradient id="arcGradH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#0dcaf0"/>
      <stop offset="100%" stop-color="#0d6efd"/>
