    <path d="M 40 130 Q 100 70 160 130" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  </g>

  <g fill="#ffffff">
    <rect x="42" y="128" width="9" height="36" rx="2"/>
    <rect x="149" y="128" width="9" height="36" rx="2"/>
  </g>

  <g>
    <rect x="35" y="144" width="130" height="7" rx="3.5" fill="#ffffff"/>
    <rect x="35" y="144" width="130" height="7" rx="3.5" fill="url(#trackGradH)" opacity="0.35"/>
    <g fill="#0a58ca">
      <rect x="48"  y="153" width="2.5" height="6" rx="1.25"/>
      <rect x="64"  y="153" width="2.5" height="6" rx="1.25"/>
      <rect x="80"  y="153" width="2.5" height="6" rx="1.25"/>
      <rect x="96"  y="153" width="2.5" height="6" rx="1.25"/>
      <rect x="112" y="153" width="2.5" height="6" rx="1.25"/>
      <rect x="128" y="153" width="2.5" height="6" rx="1.25"/>
