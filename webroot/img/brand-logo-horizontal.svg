  <g font-family="'Segoe UI', Roboto, system-ui, sans-serif" fill="#0f172a">
    <text x="220" y="115" font-size="56" font-weight="800" letter-spacing="2">TrackBridge</text>
    <text x="222" y="148" font-size="14" font-weight="500" letter-spacing="6" fill="#0d6efd">SCHEDULE &#8226; WORK &#8226; QC</text>
